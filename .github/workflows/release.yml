name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: imports the signing identity, lists it, and deletes the keychain. Nothing is
  # built or released and the tag checks are skipped. Use it to test the secrets before
  # the first tag. A release only ever comes from a v* tag push.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only test the signing secrets (import the identity, list it, clean up)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 25
    # The signing secrets live in this GitHub Environment, which is limited to v* tags, so
    # only a tag push (or a dry run you allow for a branch) can read them.
    environment: release
    steps:
      - name: Refuse a manual run that is not a dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "::error::Releases only come from pushing a v* tag. Run this workflow with dry_run enabled to test the secrets."
          exit 1

      - uses: actions/checkout@v4
        with:
          # Nothing after this needs to push; gh uses GH_TOKEN below.
          persist-credentials: false

      # The runner context isn't available in job-level env, so set the path here.
      - name: Set the keychain path
        run: echo "KEYCHAIN=$RUNNER_TEMP/clipt-signing.keychain-db" >> "$GITHUB_ENV"

      - name: Check the tag matches the app version and the changelog
        if: github.event_name == 'push'
        run: |
          version="${GITHUB_REF_NAME#v}"
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$version" != "$plist_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $plist_version"
            exit 1
          fi
          # The release notes are the first "## " section of CHANGELOG.md, so it has to be
          # this version's, not "## Unreleased".
          first_heading="$(grep -m1 '^## ' CHANGELOG.md || true)"
          case "$first_heading" in
            "## $version" | "## $version "*) ;;
            *)
              echo "::error::The first section of CHANGELOG.md is \"${first_heading:-<none>}\", expected one starting with \"## $version\". Rename \"## Unreleased\" before tagging."
              exit 1
              ;;
          esac

      - name: Test
        if: github.event_name == 'push'
        run: swift run CliptTests

      # Releases are signed with the same "Clipt Self-Signed" identity as local builds, so
      # an installed copy accepts the update (and keeps its Accessibility grant). The
      # identity lives in two secrets of the "release" environment: see "Releasing" in the README.
      # This runs right before the build so nothing earlier (checkout, tests) has the key.
      - name: Import the signing identity
        env:
          CLIPT_SIGNING_P12: ${{ secrets.CLIPT_SIGNING_P12 }}
          CLIPT_SIGNING_PASSWORD: ${{ secrets.CLIPT_SIGNING_PASSWORD }}
        run: |
          if [ -z "$CLIPT_SIGNING_P12" ] || [ -z "$CLIPT_SIGNING_PASSWORD" ]; then
            echo "::error::CLIPT_SIGNING_P12 and CLIPT_SIGNING_PASSWORD must be set; releases are never ad-hoc signed."
            exit 1
          fi
          keychain_password="$(uuidgen)"
          echo "$CLIPT_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/clipt-signing.p12"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$RUNNER_TEMP/clipt-signing.p12" -k "$KEYCHAIN" -P "$CLIPT_SIGNING_PASSWORD" -T /usr/bin/codesign \
            || { echo "::error::security import failed: wrong password, or a .p12 this runner can't read. See 'If the import fails' in the README (repack with openssl -legacy)."; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN"
          # Put it first in the search list, next to the login keychain.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/clipt-signing.p12"
          security find-identity -p codesigning "$KEYCHAIN" | tee "$RUNNER_TEMP/identities.txt"
          grep -q "Clipt Self-Signed" "$RUNNER_TEMP/identities.txt" \
            || { echo "::error::The .p12 imported, but it holds no \"Clipt Self-Signed\" identity with a private key."; exit 1; }

      - name: Build universal app
        if: github.event_name == 'push'
        run: make zip CLIPT_SIGN_IDENTITY="Clipt Self-Signed"

      - name: Check the signing identity
        if: github.event_name == 'push'
        run: |
          codesign --verify --deep --strict Clipt.app
          # The signer is pinned in the repo: a different certificate would make every
          # installed copy refuse the update.
          codesign --verify --strict -R "=$(cat Resources/designated-requirement.txt)" Clipt.app \
            || { echo "::error::Clipt.app is not signed with the pinned identity (Resources/designated-requirement.txt)"; exit 1; }

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" Clipt.zip \
            --title "Clipt ${GITHUB_REF_NAME#v}" \
            --notes-file <(awk '/^## /{n++} n==1' CHANGELOG.md)

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
