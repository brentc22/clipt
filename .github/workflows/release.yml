name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The runner context isn't available in job-level env, so set the path here.
      - name: Set the keychain path
        run: echo "KEYCHAIN=$RUNNER_TEMP/clipt-signing.keychain-db" >> "$GITHUB_ENV"

      # Releases are signed with the same "Clipt Self-Signed" identity as local builds, so
      # an installed copy accepts the update (and keeps its Accessibility grant). The
      # identity lives in two secrets: see "Development" in the README.
      - name: Check the tag matches the app version
        run: |
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "${GITHUB_REF_NAME#v}" != "$plist_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $plist_version"
            exit 1
          fi

      - name: Import the signing identity
        env:
          CLIPT_SIGNING_P12: ${{ secrets.CLIPT_SIGNING_P12 }}
          CLIPT_SIGNING_PASSWORD: ${{ secrets.CLIPT_SIGNING_PASSWORD }}
        run: |
          if [ -z "$CLIPT_SIGNING_P12" ] || [ -z "$CLIPT_SIGNING_PASSWORD" ]; then
            echo "::error::CLIPT_SIGNING_P12 and CLIPT_SIGNING_PASSWORD must be set; releases are never ad-hoc signed."
            exit 1
          fi
          keychain_password="$(uuidgen)"
          echo "$CLIPT_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/clipt-signing.p12"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$RUNNER_TEMP/clipt-signing.p12" -k "$KEYCHAIN" -P "$CLIPT_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN"
          # Put it first in the search list, next to the login keychain.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/clipt-signing.p12"
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Test
        run: swift run CliptTests

      - name: Build universal app
        run: make zip CLIPT_SIGN_IDENTITY="Clipt Self-Signed"

      - name: Check the signing identity
        run: |
          codesign --verify --deep --strict Clipt.app
          # The signer is pinned in the repo: a different certificate would make every
          # installed copy refuse the update.
          codesign --verify --strict -R "=$(cat Resources/designated-requirement.txt)" Clipt.app \
            || { echo "::error::Clipt.app is not signed with the pinned identity (Resources/designated-requirement.txt)"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Clipt.zip \
            --title "Clipt ${GITHUB_REF_NAME#v}" \
            --notes-file <(awk '/^## /{n++} n==1' CHANGELOG.md)

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
